[project]
name = "ordnweb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "flask>=3.1.3",
    "uvicorn>=0.54.0",
    "torch",
    "numpy>=2.5.4",
]

[project.scripts]
ordnweb = "ordnweb:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "miniLM",
]
